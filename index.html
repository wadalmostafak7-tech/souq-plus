<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق بلس | SouqPlus Store</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Cairo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }

    /* =========================================================
       التعديلات الجديدة الخاصة بالتجاوب وعرض المنتجات
       ========================================================= */
    /* التنسيق الأساسي للهواتف: منتجان في كل سطر */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* عرض منتجين متجاورين */
      gap: 10px; /* مسافة بسيطة بين الكروت تناسب شاشة الهاتف */
      padding: 10px;
    }

    /* تنسيق الشاشات الكبيرة (الحواسيب والأجهزة اللوحية) */
    @media (min-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(4, 1fr); /* 4 منتجات في كل سطر على الحاسوب */
        gap: 20px;
        padding: 20px;
      }
    }

    .product-card img {
      width: 100%;
      height: 150px; /* ارتفاع مناسب للصور في العرض المزدوج */
      object-fit: cover;
    }

    .product-card h3 {
      font-size: 0.9rem; /* حجم مناسب لعنوان المنتج على الهاتف */
      margin: 5px 0;
    }

    /* حركة انزلاق السلة الجانبية */
    .cart-drawer {
      transition: transform 0.3s ease-in-out;
    }
    
    /* أنيميشن طيران المنتج إلى السلة */
    .flying-item {
      position: fixed;
      z-index: 9999;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
      transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- الهيدر وشريط الملاحة -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <!-- الشعار -->
      <a href="#" class="text-2xl font-extrabold text-emerald-600 flex items-center gap-1">
        <span>سوق</span><span class="text-gray-800">بلس</span>
      </a>

      <!-- شريط البحث (لأجهزة الحاسوب) -->
      <div class="hidden md:flex flex-1 max-w-md mx-4">
        <input type="text" id="desktop-search" placeholder="ابحث عن منتج..." class="w-full px-4 py-2 border border-gray-300 rounded-r-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <button class="bg-emerald-600 text-white px-4 py-2 rounded-l-lg hover:bg-emerald-700 transition">بحث</button>
      </div>

      <!-- أزرار الإجراءات (السلة) -->
      <div class="flex items-center gap-3">
        <button id="cart-btn" class="relative p-2 text-gray-700 hover:text-emerald-600 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <span id="cart-count" class="absolute -top-1 -right-1 bg-emerald-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
      </div>
    </div>

    <!-- شريط البحث (للهواتف) -->
    <div class="p-2 border-t md:hidden">
      <input type="text" id="mobile-search" placeholder="ابحث عن منتج..." class="w-full px-4 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
  </header>

  <!-- التصنيفات -->
  <section class="bg-white border-b py-3">
    <div class="container mx-auto px-4 flex items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-none" id="categories-list">
      <button class="category-btn active px-4 py-1.5 rounded-full text-sm font-semibold bg-emerald-600 text-white" data-category="all">الكل</button>
      <button class="category-btn px-4 py-1.5 rounded-full text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200" data-category="electronics">إلكترونيات</button>
      <button class="category-btn px-4 py-1.5 rounded-full text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200" data-category="watches">ساعات</button>
      <button class="category-btn px-4 py-1.5 rounded-full text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200" data-category="bags">حقائب</button>
      <button class="category-btn px-4 py-1.5 rounded-full text-sm font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200" data-category="accessories">إكسسوارات</button>
    </div>
  </section>

  <!-- شبكة المنتجات الرئيسيّة -->
  <main class="container mx-auto flex-grow">
    <div id="products-container" class="products-grid">
      <!-- يتم توليد كروت المنتجات هنا تلقائياً بواسطة JavaScript -->
    </div>
  </main>

  <!-- السلة الجانبية (Drawer) -->
  <div id="cart-overlay" class="fixed inset-0 bg-black/50 z-50 hidden"></div>
  <aside id="cart-drawer" class="cart-drawer fixed top-0 left-0 w-full sm:w-96 h-full bg-white z-50 shadow-2xl flex flex-col transform -translate-x-full">
   <div class="p-4 border-b flex items-center justify-between bg-emerald-600 text-white">
      <h2 class="text-lg font-bold flex items-center gap-2">
        <span>سلة المشتريات</span>
      </h2>
      <div class="flex items-center gap-2">
        <button id="clear-cart-btn" class="text-xs bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded transition flex items-center gap-1" title="تفريغ السلة">
          <span>تفريغ السلة</span>
        </button>
        <button id="close-cart" class="p-1 hover:bg-emerald-700 rounded-full transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- قائمة عناصر السلة -->
    <div id="cart-items" class="flex-grow p-4 overflow-y-auto divide-y">
      <!-- عناصر السلة تظهر هنا -->
    </div>

    <!-- نموذج الطلب وإجمالي الحساب -->
    <div class="p-4 border-t bg-gray-50 space-y-3">
      <div class="flex justify-between items-center text-lg font-bold">
        <span>الإجمالي:</span>
        <span id="cart-total" class="text-emerald-600">0$</span>
      </div>

      <!-- نموذج معلومات التوصيل -->
      <form id="checkout-form" class="space-y-2">
        <input type="text" id="customer-name" placeholder="الاسم الكامل" required class="w-full px-3 py-2 text-sm border rounded focus:ring-1 focus:ring-emerald-500">
        <input type="tel" id="customer-phone" placeholder="رقم الهاتف" required class="w-full px-3 py-2 text-sm border rounded focus:ring-1 focus:ring-emerald-500">
        <input type="text" id="customer-address" placeholder="العنوان / المدينة" required class="w-full px-3 py-2 text-sm border rounded focus:ring-1 focus:ring-emerald-500">
        
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold transition flex items-center justify-center gap-2">
          <span>إرسال الطلب عبر الواتساب</span>
        </button>
      </form>
    </div>
  </aside>

  <!-- الفوتر -->
  <footer class="bg-gray-800 text-white mt-12 py-6 text-center text-sm">
    <p>© 2026 جميع الحقوق محفوظة لـ <strong>سوق بلس</strong></p>
  </footer>

  <!-- البرمجة التفاعلية JS -->
  <script>
   // متغير المنتجات ورابط Google Sheet
let products = [];
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQyRy_S8FS-Tk3cBOBrG26nAXte1Q59t5jUWEXcT_8xgdXvjswAO4epQFy0I3S5ueVYYhQTUOzQh3RX/pub?gid=0&single=true&output=csv';

// دالة تحويل CSV إلى بيانات منتجات
function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length <= 1) return [];

  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
  
  return lines.slice(1).map(line => {
    const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"\vert{}"$/g, ''));
    let obj = {};
    headers.forEach((h, i) => {
      obj[h] = values[i] || '';
    });
    return {
      id: parseInt(obj.id) || Math.random(),
      name: obj.name || 'منتج',
      price: parseFloat(obj.price) || 0,
      originalPrice: parseFloat(obj['original price'] || obj.originalprice) || 0,
      rating: parseFloat(obj.rating) || 5.0,
      category: obj.catrgory || obj.category || 'الكل',
      image: obj.image || 'https://via.placeholder.com/300x200?text=No+Image'
    };
  });
}

// دالة جلب المنتجات من Google Sheets
async function fetchProducts() {
  try {
    const res = await fetch(SHEET_CSV_URL);
    const csvText = await res.text();
    products = parseCSV(csvText);
    renderCategories();
    renderProducts(products);
  } catch (err) {
    console.error('خطأ في جلب البيانات:', err);
    productsContainer.innerHTML = `<p class="col-span-full text-center text-red-500 py-8">تعذر تحميل المنتجات.</p>`;
  }
}

    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // العناصر
    const productsContainer = document.getElementById('products-container');
    const cartBtn = document.getElementById('cart-btn');
    const closeCart = document.getElementById('close-cart');
    const cartDrawer = document.getElementById('cart-drawer');
    const cartOverlay = document.getElementById('cart-overlay');
    const cartItems = document.getElementById('cart-items');
    const cartTotal = document.getElementById('cart-total');
    const cartCount = document.getElementById('cart-count');
    const desktopSearch = document.getElementById('desktop-search');
    const mobileSearch = document.getElementById('mobile-search');
    const checkoutForm = document.getElementById('checkout-form');

 // عرض المنتجات (مع تحويل الكارت لفتح صفحة التفاصيل)
    function renderProducts(items) {
      if (items.length === 0) {
        productsContainer.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">لا توجد منتجات متاحة.</p>`;
        return;
      }

      productsContainer.innerHTML = items.map(product => `
        <div class="product-card bg-white rounded-lg border shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden cursor-pointer" onclick="window.location.href='product.html?id=${product.id}'">
          <div>
            <img src="${product.image}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
            <div class="p-3">
              <div class="flex items-center justify-between text-xs text-yellow-500 mb-1">
                <span>★ ${product.rating}</span>
              </div>
              <h3 class="font-semibold text-gray-800 text-sm line-clamp-2">${product.name}</h3>
              <div class="flex items-center gap-2 mt-2">
                <span class="text-emerald-600 font-bold text-base">${product.price}$</span>
                ${product.originalPrice ? `<span class="text-gray-400 text-xs line-through">${product.originalPrice}$</span>` : ''}
              </div>
            </div>
          </div>
          <div class="p-3 pt-0" onclick="event.stopPropagation()">
            <button onclick="addToCart(${product.id}, event)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm py-2 rounded font-semibold transition flex items-center justify-center gap-1">
              <span>إضافة للسلة</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    // حركة طيران المنتج عند الإضافة للسلة
    function animateFlyToCart(imgElement) {
      const imgRect = imgElement.getBoundingClientRect();
      const cartRect = cartBtn.getBoundingClientRect();

      const flyingImg = imgElement.cloneNode();
      flyingImg.classList.add('flying-item');
      flyingImg.style.left = `${imgRect.left}px`;
      flyingImg.style.top = `${imgRect.top}px`;
      flyingImg.style.width = `${imgRect.width}px`;
      flyingImg.style.height = `${imgRect.height}px`;

      document.body.appendChild(flyingImg);

      setTimeout(() => {
        flyingImg.style.left = `${cartRect.left + 10}px`;
        flyingImg.style.top = `${cartRect.top + 10}px`;
        flyingImg.style.width = '20px';
        flyingImg.style.height = '20px';
        flyingImg.style.opacity = '0.5';
      }, 10);

      setTimeout(() => {
        flyingImg.remove();
      }, 800);
    }

    // إضافة إلى السلة
    window.addToCart = function(id, event) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      const card = event.target.closest('.product-card');
      const img = card.querySelector('img');
      animateFlyToCart(img);

      updateCart();
    };

    // تحديث السلة
    function updateCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
      
      const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCount.textContent = totalQty;

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      cartTotal.textContent = `${totalPrice}$`;

      if (cart.length === 0) {
        cartItems.innerHTML = `<p class="text-center text-gray-500 py-8">السلة فارغة حالياً</p>`;
        return;
      }

      cartItems.innerHTML = cart.map(item => `
        <div class="py-3 flex items-center justify-between gap-2">
          <img src="${item.image}" class="w-12 h-12 rounded object-cover">
          <div class="flex-grow">
            <h4 class="text-xs font-semibold text-gray-800 line-clamp-1">${item.name}</h4>
            <p class="text-xs text-emerald-600 font-bold">${item.price}$ × ${item.quantity}</p>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 rounded text-xs font-bold">-</button>
            <span class="text-xs px-1">${item.quantity}</span>
            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-gray-200 rounded text-xs font-bold">+</button>
          </div>
        </div>
      `).join('');
    }

    // تغيير الكمية
    window.changeQty = function(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;

      item.quantity += delta;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== id);
      }

      updateCart();
    };

    // إرسال الطلب عبر الواتساب
   checkoutForm.addEventListener('submit', function(e) {
  e.preventDefault();
  if (cart.length === 0) {
    alert('السلة فارغة!');
    return;
  }

  const name = document.getElementById('customer-name').value;
  const phone = document.getElementById('customer-phone').value;
  const address = document.getElementById('customer-address').value;

  let message = `*طلب جديد من متجر بلس* 🛍️\n\n`;
  message += `*الاسم:* ${name}\n`;
  message += `*الهاتف:* ${phone}\n`;
  message += `*العنوان:* ${address}\n\n`;
  message += `*المنتجات:*\n`;

  cart.forEach((item, index) => {
    message += `${index + 1}. ${item.name} (${item.quantity}×) - ${item.price * item.quantity}$\n`;
  });

  const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  message += `\n*المبلغ الإجمالي:* ${total}$\n\nفي انتظار تأكيد الطلب وطريقة الدفع المناسبة.\nشكراً لك!`;

  const whatsappNumber = "256766177669";
  const encodedMessage = encodeURIComponent(message);
  
  // فتح الواتساب
  window.open(`https://wa.me/${whatsappNumber}?text=${encodedMessage}`, '_blank');

  // تفريغ السلة وإغلاق النافذة الجانبية بعد إرسال الطلب
  cart = [];
  updateCart();
  cartDrawer.classList.add('-translate-x-full');
  cartOverlay.classList.add('hidden');
});

    // أحداث فتح/إغلاق السلة
    cartBtn.addEventListener('click', () => {
      cartDrawer.classList.remove('-translate-x-full');
      cartOverlay.classList.remove('hidden');
    });

    closeCart.addEventListener('click', () => {
      cartDrawer.classList.add('-translate-x-full');
      cartOverlay.classList.add('hidden');
    });

    cartOverlay.addEventListener('click', () => {
      cartDrawer.classList.add('-translate-x-full');
      cartOverlay.classList.add('hidden');
    });
    const clearCartBtn = document.getElementById('clear-cart-btn');
    clearCartBtn.addEventListener('click', () => {
      if (cart.length === 0) return;
      if (confirm('هل أنت تأكد من رغبتك في تفريغ السلة؟')) {
        cart = [];
        updateCart();
      }
    });

   // إنشاء التصنيفات تلقائياً من العمود الموجود في الشيت
function renderCategories() {
  const categoriesList = document.getElementById('categories-list');
  if (!categoriesList) return;

  const categories = ['الكل', ...new Set(products.map(p => p.category))];
  categoriesList.innerHTML = categories.map((cat, idx) => `
    <button class="category-btn ${idx === 0 ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'} px-4 py-1.5 rounded-full text-sm font-semibold transition" data-category="${cat}">
      ${cat}
    </button>
  `).join('');

  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.category-btn').forEach(b => {
        b.classList.remove('bg-emerald-600', 'text-white');
        b.classList.add('bg-gray-100', 'text-gray-600');
      });
      e.target.classList.add('bg-emerald-600', 'text-white');
      e.target.classList.remove('bg-gray-100', 'text-gray-600');

      const cat = e.target.dataset.category;
      renderProducts(cat === 'الكل' ? products : products.filter(p => p.category === cat));
    });
  });
}
    // البحث
    function handleSearch(query) {
      const q = query.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(q));
      renderProducts(filtered);
    }

    desktopSearch.addEventListener('input', (e) => handleSearch(e.target.value));
    mobileSearch.addEventListener('input', (e) => handleSearch(e.target.value));

    // التشغيل المبدئي
   fetchProducts();
    updateCart();
  </script>
</body>
</html>
