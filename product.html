<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- السماح بالتكبير بحركة الأصابع -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق بلس | جميع المنتجات</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts (Cairo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }

    /* منع التكبير بالنقر المزدوج والسماح بالتكبير بحركة الأصابع */
    html, body, a, button, input {
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- الهيدر -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-extrabold text-emerald-600 flex items-center gap-1">
        <span>سوق</span><span class="text-gray-800">بلس</span>
      </a>

      <a href="cart.html" class="relative text-gray-700 hover:text-emerald-600 transition p-2">
        🛒 السلة
        <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
      </a>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="container mx-auto px-4 py-8 flex-grow">
    <!-- عنوان وقسم التصنيفات -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900">جميع المنتجات</h1>
        <p class="text-gray-500 text-sm mt-1">تصفح أحدث المنتجات والعروض المتاحة</p>
      </div>

      <!-- تصنيفات المنتجات -->
      <div id="categories-container" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
        <button class="cat-btn active bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap" onclick="filterCategory('الكل', this)">الكل</button>
      </div>
    </div>

    <!-- شبكة المنتجات -->
    <div id="loading" class="text-center py-12 text-gray-500 font-semibold">
      جاري تحميل المنتجات...
    </div>

    <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6">
      <!-- يتم عرض المنتجات هنا ديناميكياً -->
    </div>
  </main>

  <!-- الفوتر -->
  <footer class="bg-gray-800 text-white py-6 text-center text-sm mt-12">
    <p>© 2026 جميع الحقوق محفوظة لـ <strong>سوق بلس</strong></p>
  </footer>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQyRy_S8FS-Tk3cBOBrG26nAXte1Q59t5jUWEXcT_8xgdXvjswAO4epQFy0I3S5ueVYYhQTUOzQh3RX/pub?gid=0&single=true&output=csv';
    let allProducts = [];

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length <= 1) return [];

      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
      
      return lines.slice(1).map(line => {
        const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"\vert{}"$/g, ''));
        let obj = {};
        headers.forEach((h, i) => {
          obj[h] = values[i] || '';
        });
        return {
          id: parseInt(obj.id),
          name: obj.name || '',
          price: parseFloat(obj.price) || 0,
          originalPrice: parseFloat(obj['original price'] || obj.originalprice) || 0,
          rating: parseFloat(obj.rating) || 5.0,
          category: obj.catrgory || obj.category || 'عام',
          image: obj.image || 'https://via.placeholder.com/300x200?text=No+Image',
          stock: (obj.stock !== undefined && obj.stock !== '') ? parseInt(obj.stock) : 10
        };
      }).filter(p => !isNaN(p.id) && p.name.trim() !== '');
    }

    async function fetchProducts() {
      try {
        const res = await fetch(`${SHEET_CSV_URL}&_t=${Date.now()}`);
        const csvText = await res.text();
        allProducts = parseCSV(csvText);
        
        renderCategories();
        renderProducts(allProducts);
        updateCartCount();
      } catch (err) {
        console.error('خطأ في تحميل المنتجات:', err);
        document.getElementById('loading').innerText = 'حدث خطأ أثناء تحميل المنتجات.';
      }
    }

    function renderCategories() {
      const categories = ['الكل', ...new Set(allProducts.map(p => p.category))];
      const container = document.getElementById('categories-container');
      
      container.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === 'الكل' ? 'bg-emerald-600 text-white' : 'bg-white text-gray-700 border hover:bg-gray-100'} px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap shadow-sm" onclick="filterCategory('${cat}', this)">
          ${cat}
        </button>
      `).join('');
    }

    function filterCategory(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = 'cat-btn bg-white text-gray-700 border hover:bg-gray-100 px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap shadow-sm';
      });
      btn.className = 'cat-btn bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap shadow-sm';

      if (category === 'الكل') {
        renderProducts(allProducts);
      } else {
        const filtered = allProducts.filter(p => p.category === category);
        renderProducts(filtered);
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('products-grid');
      document.getElementById('loading').classList.add('hidden');

      if (products.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center py-8 text-gray-500">لا توجد منتجات في هذا التصنيف.</p>';
        return;
      }

      grid.innerHTML = products.map(product => `
        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col justify-between hover:shadow-md transition">
          <a href="product.html?id=${product.id}" class="block relative group">
            <img src="${product.image}" alt="${product.name}" class="w-full h-44 object-cover group-hover:scale-105 transition duration-300">
            ${product.stock <= 0 ? '<span class="absolute top-2 right-2 bg-gray-900/80 text-white text-xs px-2 py-1 rounded-md font-bold">نفدت الكمية</span>' : ''}
          </a>
          
          <div class="p-4 flex flex-col flex-grow justify-between space-y-3">
            <div>
              <span class="text-xs text-emerald-600 font-bold bg-emerald-50 px-2 py-0.5 rounded-md">${product.category}</span>
              <a href="product.html?id=${product.id}" class="block mt-1">
                <h3 class="font-bold text-gray-900 text-sm line-clamp-2 hover:text-emerald-600 transition">${product.name}</h3>
              </a>
            </div>

            <div>
              <div class="flex items-center justify-between mb-3">
                <div>
                  <span class="text-lg font-extrabold text-emerald-600">${product.price}$</span>
                  ${product.originalPrice ? `<span class="text-xs text-gray-400 line-through mr-1">${product.originalPrice}$</span>` : ''}
                </div>
                <span class="text-xs text-yellow-500 font-bold">★ ${product.rating}</span>
              </div>

              <a href="product.html?id=${product.id}" class="block w-full text-center bg-gray-100 hover:bg-emerald-600 hover:text-white text-gray-800 py-2 rounded-xl text-xs font-bold transition">
                عرض التفاصيل
              </a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const countEl = document.getElementById('cart-count');
      
      if (totalItems > 0) {
        countEl.textContent = totalItems;
        countEl.classList.remove('hidden');
      } else {
        countEl.classList.add('hidden');
      }
    }

    fetchProducts();
  </script>
</body>
</html>
